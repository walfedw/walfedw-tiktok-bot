name: Publicador Semanal TikTok

on:
  schedule:
    # Se ejecuta Lunes (1), Miércoles (3) y Viernes (5) a las 14:00 UTC (9:00 AM Perú)
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Permiso obligatorio para que la Action pueda hacer git push de historial.json
    permissions:
      contents: write

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar FFmpeg y Fuentes System
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu

    - name: Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar Navegador Chromium (Playwright)
      run: |
        playwright install chromium --with-deps

    - name: Ejecutar Agente de Noticias
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: Guardar Historial en el Repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add historial.json
        git commit -m "Auto: Actualizar historial de juegos [skip ci]" || echo "Sin cambios en historial"
        git push || echo "No hay cambios para subir"
