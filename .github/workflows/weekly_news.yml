name: Publicador Semanal TikTok

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar FFmpeg y Fuentes
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu

    - name: Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar Navegador Chromium (Playwright)
      run: |
        playwright install chromium --with-deps

    - name: Ejecutar Agente de Noticias
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: Guardar Historial en el Repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add historial.json
        git commit -m "Actualizar historial.json con juegos usados [skip ci]" || echo "Sin cambios en historial"
        git push || echo "No hay cambios para subir"
